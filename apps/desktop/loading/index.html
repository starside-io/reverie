<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Reverie</title>
    <!--
      The splash: what the window shows while the host starts, and for a moment
      at least even when one is already up (see main.rs). Self contained: no
      fonts, no scripts, nothing fetched. The mark is the UI's favicon.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --page: #f6f1ea;
        --ink: #2a2b2e;
        --muted: #7d7a86;
      }
      @media (prefers-color-scheme: dark) {
        :root { --page: #232427; --ink: #ece8f2; --muted: #a09cab; }
      }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        background: var(--page);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }
      .splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        animation: rise 600ms cubic-bezier(.2, .7, .2, 1) both;
      }
      .mark { width: 168px; height: 168px; }
      .sand {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: settle 2.8s ease-in-out infinite;
      }
      .cap { fill: var(--ink); }
      .name { font-size: 38px; font-weight: 650; letter-spacing: -0.02em; margin: 0; }
      .by { font-size: 15px; color: var(--muted); margin: -12px 0 0; letter-spacing: 0.01em; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes settle {
        0%, 100% { transform: scaleY(0.82); }
        50% { transform: scaleY(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash, .sand { animation: none; }
      }
    </style>
  </head>
  <body>
    <main class="splash" aria-label="Reverie by starside.io, starting">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><path d="M16 10H48C48 22 38 26 34 32C38 38 48 42 48 54H16C16 42 26 38 30 32C26 26 16 22 16 10Z" fill="#4f9a68"/><path d="M22 14H42C40 20 35 23 32 27C29 23 24 20 22 14Z" fill="#a3d9b0"/><g class="sand"><path d="M20 54C21 47 27 44 32 40C37 44 43 47 44 54Z" fill="#ecc59a"/></g><rect x="12" y="6" width="40" height="4.5" rx="2.25" class="cap"/><rect x="12" y="53.5" width="40" height="4.5" rx="2.25" class="cap"/></svg>
      <p class="name">Reverie</p>
      <p class="by">by starside.io</p>
    </main>
  </body>
</html>
