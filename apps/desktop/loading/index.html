<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Reverie</title>
    <!--
      The splash: what the window shows while the host starts, and for a moment
      at least even when one is already up (see main.rs). Self contained: no
      fonts, no scripts, nothing fetched. The mark is the UI's favicon.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --page: #f6f1ea;
        --ink: #2a2b2e;
        --muted: #7d7a86;
      }
      @media (prefers-color-scheme: dark) {
        :root { --page: #232427; --ink: #ece8f2; --muted: #a09cab; }
      }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        background: var(--page);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }
      .splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        animation: rise 600ms cubic-bezier(.2, .7, .2, 1) both;
      }
      .mark { width: 168px; height: 168px; }
      .leaning {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: settle 2.8s ease-in-out infinite;
      }
      .shelf { fill: var(--ink); }
      .name { font-size: 38px; font-weight: 650; letter-spacing: -0.02em; margin: 0; }
      .by { font-size: 15px; color: var(--muted); margin: -12px 0 0; letter-spacing: 0.01em; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes settle {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-3deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash, .leaning { animation: none; }
      }
    </style>
  </head>
  <body>
    <main class="splash" aria-label="Reverie by starside.io, starting">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><rect x="10" y="12" width="9" height="40" rx="2" fill="#3f4f8f"/><rect x="22" y="18" width="9" height="34" rx="2" fill="#7c8ac4"/><rect x="34" y="12" width="9" height="40" rx="2" fill="#3f4f8f"/><g class="leaning"><rect x="45" y="16" width="9" height="36" rx="2" transform="rotate(12 49.5 34)" fill="#ecc59a"/></g><rect class="shelf" x="6" y="52" width="52" height="3" rx="1.5"/></svg>
      <p class="name">Reverie</p>
      <p class="by">by starside.io</p>
    </main>
  </body>
</html>
